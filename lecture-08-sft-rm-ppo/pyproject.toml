[project]
name = "lecture-08-sft-rm-ppo"
version = "0.1.0"
description = "InstructGPT post-training lecture: SFT → Reward Model → PPO"
requires-python = ">=3.12"
dependencies = [
    "torch==2.6.0",
    "torchvision==0.21.0",
    "transformers>=5.8.0",
    "datasets>=4.8.5",
    "wandb>=0.26.1",
    "accelerate>=1.13.0",
    "tqdm>=4.67.3",
    "matplotlib>=3.10.9",
    "numpy>=2.4.3",
    "pandas>=3.0.2",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "jupyterlab>=4.5.7",
]

[tool.uv]
find-links = ["https://download.pytorch.org/whl/cu124"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
